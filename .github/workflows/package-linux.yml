name: Package VoxShop for Linux

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-linux:
    name: Build DEB and AppImage
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - name: Install locked Node dependencies
        run: npm ci

      - name: Build Linux desktop packages
        run: npm run desktop:build-app -- --bundles deb,appimage

      - name: Verify packaged sidecar and MCP runtime
        run: npm run verify:desktop-runtime

      - name: Validate package artifacts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t debs < <(find src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print)
          mapfile -t appimages < <(find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print)
          if (( ${#debs[@]} != 1 || ${#appimages[@]} != 1 )); then
            printf 'Expected exactly one DEB and one AppImage; found %s DEB(s), %s AppImage(s).\n' "${#debs[@]}" "${#appimages[@]}" >&2
            exit 1
          fi
          test -s "${debs[0]}"
          test -s "${appimages[0]}"
          dpkg-deb --info "${debs[0]}"
          file "${debs[0]}" "${appimages[0]}"

      - name: Upload clean Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: voxshop-linux-x86_64
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14
