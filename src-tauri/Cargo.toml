[package]
name = "voxshop-desktop"
version = "2.0.0-alpha.1"
description = "VoxShop voxel game engine by Hexxis Studios"
authors = ["Hexxis Studios"]
edition = "2021"

[lib]
name = "voxshop_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tokio = { version = "1", features = ["sync", "time"] }
